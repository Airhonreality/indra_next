[package]
name = "indra-daemon"
version = "0.1.0"
edition = "2021"

[dependencies]
tonic = "0.11"
prost = "0.12"
prost-types = "0.12"
tokio = { version = "1.40", features = ["full"] }
tokio-util = "0.7"
anyhow = "1.0"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sqlx = { version = "0.8", features = ["sqlite", "runtime-tokio-rustls"] }
blake3 = "1.5"
hex = "0.4"
hmac = "0.12"
sha2 = "0.10"
rand = "0.8"
uuid = { version = "1.10", features = ["v4", "serde"] }
async-trait = "0.1"
dashmap = "6.0"
futures = "0.3"
mdns-sd = "0.8"
rustls = { version = "0.23", features = ["std"] }
rcgen = "0.12"
chrono = { version = "0.4", features = ["serde"] }
notify = "6.0"
tempfile = "3.0"
env_logger = "0.11"
clap = { version = "4.5", features = ["derive"] }

[build-dependencies]
tonic-build = "0.11"

[[bin]]
name = "indra-daemon"
path = "src/main.rs"

[lib]
name = "indra_daemon"
path = "src/lib.rs"

[dev-dependencies]
tempfile = "3.0"
tokio-test = "0.4"

name: Build & Test Installers

on:
  push:
    branches: [main, develop]
    paths:
      - 'tauri-installer/**'
      - '.github/workflows/build.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'tauri-installer/**'

env:
  CARGO_TERM_COLOR: always

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v3

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install Tauri CLI
        run: npm install -g @tauri-apps/cli

      - name: Install dependencies
        working-directory: tauri-installer
        run: npm install

      - name: Build
        working-directory: tauri-installer
        run: npm run tauri build -- --target x86_64-pc-windows-msvc

      - name: Test installer creation
        working-directory: tauri-installer
        run: |
          $msiPath = Get-ChildItem -Path "src-tauri/target/release/bundle/msi" -Filter "*.msi" | Select-Object -First 1
          if ($msiPath) {
            Write-Host "✓ MSI created: $($msiPath.FullName)"
          } else {
            throw "MSI not found"
          }

      - name: Upload artifacts
        uses: actions/upload-artifact@v3
        with:
          name: windows-installer
          path: tauri-installer/src-tauri/target/release/bundle/msi/*.msi

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev libgtk-3-dev libayatana-appindicator3-dev

      - name: Install Tauri CLI
        run: npm install -g @tauri-apps/cli

      - name: Install dependencies
        working-directory: tauri-installer
        run: npm install

      - name: Build
        working-directory: tauri-installer
        run: npm run tauri build -- --target x86_64-unknown-linux-gnu

      - name: Test deb creation
        working-directory: tauri-installer
        run: |
          if ls src-tauri/target/release/bundle/deb/*.deb 2>/dev/null; then
            echo "✓ DEB created"
          else
            exit 1
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v3
        with:
          name: linux-installer
          path: tauri-installer/src-tauri/target/release/bundle/deb/*.deb

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install dependencies
        working-directory: tauri-installer
        run: npm install

      - name: Check TypeScript
        working-directory: tauri-installer
        run: npx tsc --noEmit

  cargo-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - uses: dtolnay/rust-toolchain@stable

      - name: Cargo check
        working-directory: tauri-installer
        run: cargo check

      - name: Cargo test
        working-directory: tauri-installer
        run: cargo test --lib
